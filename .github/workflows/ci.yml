name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        # The AI-fund repair suite (server/test/fundRepair.test.ts) is fully
        # hermetic: quotes injected via provider seam / fetch mock, isolated
        # temp store, no secrets, no ~/.civicfolio access, no scheduler.
        # NOTE: the pre-existing server/test/api.test.ts makes a small number
        # of live provider fetches (Yahoo/SEC/DDG) that tolerate failure
        # (asserts 200 or an explicit error); on a fully network-isolated
        # runner one api.test.ts case would fail (503). It is tracked apart.
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
