name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests (hermetic, mocked providers, isolated temp store)
        # The suite never contacts live market/financial providers, needs no
        # secrets, does not read ~/.civicfolio, and does not start the fund
        # scheduler. All quote/model/fetch calls are mocked.
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
